# 基础包竞态检测（pkg/jwt、pkg/tracer、pkg/logger 共用）
#
# 背景：本仓开发机为 Windows + MinGW，`go test -race` 因 cgo 运行库问题报
# exit status 0xc0000139，无法在本机取证；本 workflow 在 Linux CI 上补上
# `-race` 证据，对应各包 README「竞态检测」章节的诚实声明。
#
# 范围仅限三个基础包的原因：
#   1. 这三份 README 均声明「真实竞态证据需在 Linux/CI 采集」；
#   2. 集成测试均带 //go:build integration tag，默认不编译，-race 无需外部环境；
#   3. 全仓 -race 会命中其他包的既有问题（如 pkg/gows 的 Close/Drain 测试），
#      与本 workflow 的取证目标无关，待相关包修复后再扩大范围。
name: race

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=1 是 -race 的前提，ubuntu-latest 自带 gcc，无需额外安装
      - name: Race detection (pkg/jwt, pkg/tracer, pkg/logger)
        run: CGO_ENABLED=1 go test -race -short -count=1 ./pkg/jwt/ ./pkg/tracer/ ./pkg/logger/
