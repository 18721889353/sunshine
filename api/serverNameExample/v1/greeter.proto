syntax = "proto3";

package api.greeter.v1;

import "validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 第一个logService是go module名称，第二个logService是服务名称，v1是版本号
option go_package = "fuliApiGo/api/fuliApiGo/v1;v1";

//https://toolin.cn/json2proto
//https://github.com/bufbuild/protoc-gen-validate


option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "127.0.0.1"
  base_path: ""
  info: {
    title: "go platformServer api docs";
    version: "1.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Input a \"Bearer your-jwt-token\" to Value";
      }
    }
  }
};



service Greeter {
  rpc Hello (HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      custom: {
        kind: "websocket"
        path: "/go-api/v1/greeter/hello"
      }
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "hello",
      description: "hello",
    };
  }
}

message HelloRequest {
  string type = 1;
  string name = 2;
}

message HelloReply {
  string message = 1;
}
