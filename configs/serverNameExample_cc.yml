# 所有集群节点使用完全相同的环境变量
#docker run -d \
#--name nacos-node-1 \
#-e MODE=cluster \                              # 集群模式
#-e NACOS_AUTH_ENABLE=true \
#-e NACOS_AUTH_TOKEN=Z8aQ4I8xS6NlpBVugqNzdRYyCUKa9BiHjiKXoRzXrrk= \  # 所有节点相同！
#-e NACOS_AUTH_IDENTITY_KEY=sunshine \           # 所有节点相同！
#-e NACOS_AUTH_IDENTITY_VALUE=sunshine \         # 所有节点相同！
#-e NACOS_SERVERS="192.168.1.1:8848 192.168.1.2:8848" \  # 集群成员列表
#nacos/nacos-server:v2.4.3

#  NACOS_AUTH_TOKEN   JWT 签发密钥，服务端用
#  NACOS_AUTH_IDENTITY_KEY/VALUE  Nacos 集群内部身份识别
# 首次使用步骤:
#   1. 启动 Docker Nacos 后访问 http://127.0.0.1:8848/nacos
#   2. 使用默认账号 nacos/nacos 登录
#   3. 进入"配置管理"→"配置列表"，创建 dataID 指定的配置
#   4. 配置内容为你的业务配置（serverNameExample.yml 内容）


# ETCD 安装
#步骤 1：创建 Docker 共享网络
docker network create etcd-net

#步骤 2：安装并启动 etcd (带密码验证)
docker run -d --name etcd \
--network etcd-net \
-p 2379:2379 \
-p 2380:2380 \
-e ALLOW_NONE_AUTHENTICATION=no \
-e ETCD_ROOT_PASSWORD=sunshine \
bitnami/etcd:latest
  
docker run -d \
--name etcdkeeper \
--network etcd-net \
-p 8080:8080 \
evildecay/etcdkeeper \
-h 0.0.0.0 -p 8080
