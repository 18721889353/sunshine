都是# 生成go结构体命令: sunshine config --server-dir=./serverDir

# 应用设置
app:
  name: "serverNameExample"       # 服务名称
  env: "dev"                      # 运行环境, dev: 开发环境, prod: 生产环境, test: 测试环境
  version: "v0.0.0"               # 版本号
  host: "127.0.0.1"               # 域名或IP, 用于服务注册
  enableStat: false               # 是否开启打印统计, true:开启, false:关闭
  enableMetrics: false            # 是否开启指标收集, true:开启, false:关闭
  enableHTTPProfile: true         # 是否开启性能分析, true:开启, false:关闭
  enableLimit: false              # 是否开启限流(自适应), true:开启, false:关闭
  enableCircuitBreaker: false     # 是否开启熔断器(自适应), true:开启, false:关闭
  enableTrace: false              # 是否开启链路追踪, true:开启, false:关闭, 如果为true必须设置jaeger配置
  tracingSamplingRate: 1.0        # 链路追踪采样率, 介于0和1之间, 0表示不采样, 1表示采样所有链路
  registryDiscoveryType: ""       # 注册与发现类型: etcd / nacos, 如果为空, 不使用注册与发现
  cacheType: ""                   # 缓存类型, 如果为空, 不使用缓存, 支持"memory"和"redis", 如果设置为redis, 必须设置redis配置
  openHttp: true                  # 是否开启http服务, true:开启, false:关闭
  openXSS: true                   # 是否开启xss过滤, true:开启, false:关闭
  openJwt: true                   # 是否开启jwt认证, true:开启, false:关闭
  openSign: true                  # 是否开启签名认证, true:开启, false:关闭
  openCron: false                 # 是否开启定时任务, true:开启, false:关闭

# http服务设置
http:
  port: 8001                      # 监听端口
  timeout: 0                      # 请求超时时间(秒), 如果为0表示不设置, 如果大于0表示设置超时时间, 如果enableHTTPProfile为true, 需要设置为0或大于60秒

# grpc服务设置
grpc:
  port: 7001                      # 监听端口
  httpPort: 6001                  # 性能分析和指标端口
  enableToken: false              # 是否开启服务端token认证, 默认appID=grpc, appKey=123456
  # serverSecure 参数设置
  # 如果type="", 表示无安全连接, 无需填写任何参数
  # 如果type="one-way", 表示服务端认证, 只需填写'certFile'和'keyFile'字段
  # 如果type="two-way", 表示客户端和服务端双向认证, 需要填写所有字段
  serverSecure:
    type: ""                      # 安全类型, "", "one-way", "two-way"
    caFile: ""                    # ca证书文件, 仅在"two-way"时有效, 绝对路径
    certFile: ""                  # 服务端证书文件, 绝对路径
    keyFile: ""                   # 服务端密钥文件, 绝对路径

# grpc客户端设置, 支持设置多个grpc客户端
grpcClient:
  - name: "serverNameExample"     # grpc服务名称, 用于服务发现
    host: "127.0.0.1"             # grpc服务地址, 用于直连
    port: 8282                    # grpc服务端口
    timeout: 0                    # 请求超时时间(秒), 如果为0表示不设置, 如果大于0表示设置超时时间, 仅对一元grpc类型有效
    registryDiscoveryType: ""     # 注册与发现类型: etcd / nacos, 如果为空, 使用host和port连接服务器
    enableLoadBalance: true       # 是否开启负载均衡
    # clientSecure 参数设置
    # 如果type="", 表示无安全连接, 无需填写任何参数
    # 如果type="one-way", 表示服务端认证, 只需填写'serverName'和'certFile'字段
    # 如果type="two-way", 表示客户端和服务端双向认证, 需要填写所有字段
    clientSecure:
      type: ""                    # 安全类型, "", "one-way", "two-way"
      serverName: ""              # 服务器名称, 例如 *.foo.com
      caFile: ""                  # 客户端ca文件, 仅在"two-way"时有效, 绝对路径
      certFile: ""                # 客户端证书文件, 绝对路径, 如果secureType="one-way", 在此处填写服务端证书文件
      keyFile: ""                 # 客户端密钥文件, 仅在"two-way"时有效, 绝对路径
    clientToken:
      enable: false               # 是否开启token认证
      appID: ""                   # 应用ID
      appKey: ""                  # 应用密钥


# 日志设置
logger:
  level: "info"                   # 输出日志级别 debug, info, warn, error, 默认为info（生产环境推荐）
  format: "console"               # 输出格式, console或json, 默认为json（便于结构化解析）
  isSave: false                   # false:输出到终端, true:输出到文件, 默认为true（生产环境必须）
  maxLen: 102400                  # 单条日志最大大小
  isAsync: true                   # 是否异步输出日志（强烈建议启用，性能提升155%）
  asyncBufferSize: 8              # 异步缓冲区大小单位(M)，默认8M（平衡内存与性能）
  asyncFlushInterval: 5           # 异步刷新间隔(秒)，默认5秒（降低延迟）
  # 当isSave=true时有效
  logFileConfig:
    filename: "logs/app.log"      # 文件名(支持相对路径，默认为logs/app.log)
    isSaveDay: true               # 是否按天保存（建议启用，便于日志管理）
    maxSize: 100                  # 最大文件大小(MB, 默认100MB，避免频繁轮转)
    maxBackups: 30                # 最大保留旧文件数量(默认30个，约3GB空间)
    maxAge: 7                     # 最大保留旧文件天数(默认7天，平衡存储与追溯需求)
    isCompression: true           # 是否压缩/归档旧文件(默认true，节省90%存储空间)
    isNoPrint: false              # 禁止终端/文件输出（默认false，开发环境可查看）
  # 日志路由配置 - 支持按模块/级别将日志保存到不同文件
  # 未指定的数值字段(maxSize/maxBackups/maxAge)自动继承 logFileConfig 的配置
  # 注意: 布尔值(isCompression/isSaveDay/isAsync)和字符串(format)不会继承,需要在 YAML 中明确指定
  routes:
    # 示例1: 订单模块日志单独存储
    - module: "order"
      filename: "logs/order/order.log"  # 使用相对路径，便于部署
      maxSize: 200          # 覆盖默认: 订单日志更大 (默认100MB)
      maxBackups: 50        # 覆盖默认: 保留更多备份 (默认30个)
      maxAge: 30            # 覆盖默认: 保留更久 (默认7天)
      isSaveDay: true       # 显式指定: 按天保存
      format: "json"        # 显式指定: JSON格式
      isAsync: true         # 显式指定: 异步写入（关键性能优化）
      isCompression: true   # 显式指定: 压缩旧文件

# 阿里云 SLS 日志服务配置
sls:
  enable: false                   # 是否启用 SLS 日志上报（生产环境建议启用）
  endpoint: "cn-shanghai.log.aliyuncs.com"  # SLS Endpoint (根据地域修改，建议与服务器同地域)
  accessKeyId: ""                 # AccessKey ID (建议使用环境变量 SLS_ACCESS_KEY_ID)
  accessKeySecret: ""             # AccessKey Secret (建议使用环境变量 SLS_ACCESS_KEY_SECRET)
  project: ""                     # SLS Project 名称
  logstore: "application-log"     # SLS Logstore 名称
  topic: "app-log"                # 日志主题
  source: ""                      # 日志来源 (留空自动获取主机IP)
  # Producer 基础配置（基于压测结果优化）
  retries: 10                     # 重试次数, 默认10次
  timeout: 60                     # 超时时间(秒)，默认 60 秒
  # Producer 性能配置
  totalSizeLnBytes: 536870912     # 缓存总大小(字节)，默认 512MB (512 * 1024 * 1024)
  maxBatchCount: 4096             # 单个 Batch 最大日志条数，默认 4096
  maxBatchSize: 3145728           # 单个 Batch 最大大小(字节)，默认 3MB (3 * 1024 * 1024)
  lingerMs: 2000                  # Batch 刷新间隔(毫秒)，默认 2000ms (平衡实时性与吞吐量)
  disableRuntimeMetrics: true     # 禁用运行时指标日志，避免每分钟打印 report status
  # 高级配置
  enableHealthCheck: false         # 是否启用健康检查，默认 false
  healthCheckInterval: 30         # 健康检查间隔(秒)，默认 30 秒 最少5秒
  sendTimeout: 5                  # 发送超时时间(秒)，默认 5 秒
# 数据库设置
database:
  driver: "mysql"                 # 数据库驱动
  # mysql设置
  mysql:
    # dsn格式,  <用户名>:<密码>@(<主机名>:<端口>)/<数据库>?[k=v& ......]
    dsn: "root:jianguo123@(127.0.0.1:3306)/hello?parseTime=true&loc=UTC&charset=utf8mb4"
    enableLog: false               # 是否开启打印所有日志
    slowQueryThresholdMs: 300     # 慢查询阈值，单位毫秒
    maxIdleConns: 10              # 设置空闲连接池中最大连接数 通常设置为小于 maxOpenConns
    maxOpenConns: 20              # 设置数据库最大打开连接数
    connMaxLifetime: 30           # 设置连接的最大存活时间(分)  建议小于数据库的 wait_timeout
    maxIdleTime: 5                # 设置连接的最大空闲时间(分) 必须远小于数据库的 wait_timeout
    # 设置从库mysql dsn, 数组类型
    slavesDsn:
      - "root:jianguo123@(127.0.0.1:3306)/hello?parseTime=true&loc=UTC&charset=utf8mb4"
    # 设置主库mysql dsn, 数组类型, 非必填字段, 如果只有一个主库, 无需设置mastersDsn字段, 默认dsn字段即为mysql主库
    mastersDsn:
      - "root:jianguo123@(127.0.0.1:3306)/hello?parseTime=true&loc=UTC&charset=utf8mb4"


# redis设置
redis:
  # dsn格式, [用户]:<密码>@127.0.0.1:6379/[数据库], 默认用户为default, redis 6.0及以上版本仅支持用户
  dsn: ":jianguo123@127.0.0.1:6379/0"
  dialTimeout: 10                 # 连接超时时间(秒)
  readTimeout: 2                  # 读取超时时间(秒)
  writeTimeout: 2                 # 写入超时时间(秒)
  poolSize: 1                     # 连接池大小
  minIdleConns: 10                # 最小空闲连接数
  maxConnAge: 60                  # 连接最大存活时间(秒)
  poolTimeout: 10                 # 连接池超时时间(秒)
  idleTimeout: 30                 # 连接最大空闲时间(秒)

# jaeger设置
jaeger:
  agentHost: "127.0.0.1"          # Jaeger代理主机
  agentPort: 6831                 # Jaeger代理端口
  endpoint: ""                    # JaegerHTTP端点

# etcd设置
etcdInfo:
  etcdServer:
    addrs: # ETCD地址列表
      - "127.0.0.1:2379"
  etcdClient:
    username: ""                   # 认证用户名（etcd 启用 auth 时填写）
    password: ""                   # 认证密码
    dialTimeout: 5s                 # 连接超时（默认 5s）
    dialKeepAliveTime: 20s          # 保持连接的时间间隔（默认 20s）
    dialKeepAliveTimeout: 10s       # 保持连接的超时时间（默认 10s）
    autoSyncInterval: 0s            # 成员列表自动同步间隔（0=不启用）
    # TLS 安全连接
    isSecure: false                 # 是否启用 TLS 安全连接
    serverNameOverride: ""          # TLS 服务器域名覆盖
    certFile: ""                    # TLS 证书文件路径
    caFile: ""                      # CA 证书文件路径（双向 mTLS 时填写）
  etcdRegistry:
    namespace: "/microservices"    # etcd 键前缀命名空间
    ttl: 15s                        # 注册租约 TTL（租约到期后自动摘除）
    maxRetry: 5                     # 重注册最大重试次数
    checkInterval: 3                # key 存在性校验间隔（心跳响应次数，3=每3次心跳校验1次）
    # 重试退避
    backoffInit: 1s                 # 重注册指数退避初始间隔
    backoffMax: 30s                 # 重注册指数退避最大间隔

# nacos服务注册与发现设置
nacosInfo:
  nacosServer:
    ipAddr: ""                      # Nacos 服务器地址
    port: 8848                       # Nacos 服务器端口（8848=HTTP, 9848=gRPC）
    scheme: ""                       # 协议，http 或 grpc（空=使用 SDK 默认） "https" 即启用 TLS
    contextPath: "/nacos"           # Nacos 上下文路径
  nacosClient:
    namespaceID: ""                  # 命名空间 ID（空=public 命名空间）
    timeoutMs: 5000                  # 请求超时（毫秒，默认 5000）
    # 连接认证
    username: ""                     # 认证用户名（Nacos 开启 auth 时填写）
    password: ""                     # 认证密码
  nacosRegistry:
    groupName: "DEFAULT_GROUP"      # 服务注册分组
    clusterName: "DEFAULT"          # 集群名称
    # 实例属性
    weight: 1                        # 注册实例权重（范围 0~10000）
    ephemeral: true                  # 是否临时实例（true=心跳保活，断开自动移除；false=持久实例）
    registerEnabled: true            # 注册后是否启用（false=不下发流量）
    healthy: true                    # 注册时实例健康状态（仅对持久实例有效）
    # 自愈校验
    checkInterval: 30s               # 实例存在性校验间隔（0=不启用）
    # 重试退避
    backoffInit: 1s                  # 重注册指数退避初始间隔
    backoffMax: 30s                  # 重注册指数退避最大间隔

# 签名设置
sign:
  signExpiredTime: 10             # 签名过期时间(秒)
  signKey: "WQAIys9Lyb1DyArc7bwLvKfc5km0gHx2"  # 签名密钥
  ignoreUrls: # 忽略签名验证的URL
    http:
      - "/api/fd_v1/test"
    grpc:
      - "/api.feedovService.v1.feedovService/test"

# JWT设置
jwt:
  expire: 120                     # 过期时间(分钟)
  signingKey: "sunshine"          # 签名密钥
  signingMethod: "HS256"          # 签名方法
  issuer: "sunshine"              # 签发者
  ignoreMethods: # 忽略JWT验证的方法
    http:
      - "/api/v1/auth/captcha"
      - "/api/v1/auth/login"
    grpc:
      - "/api.adminService.v1.adminLoginService/Captcha"
      - "/api.adminService.v1.adminLoginService/Login"

# Sentinel设置
sentinel:
  rules: # 规则列表
    - resource: "default"         # 资源名称
      threshold: 1.0              # 阈值
      statIntervalInMs: 2000      # 统计时间窗口(毫秒)

# RabbitMQ设置
rabbitmq:
  enable: false                   # 是否启用rabbitmq
  pool: # 连接池配置
    url: "amqp://user:password@host:5672/"  # 连接URL
    initialCap: 50                # 初始连接数
    maxCap: 100                   # 最大连接数
    healthCheckPeriod: 30         # 健康检查间隔(秒)
    maxIdle: 300                  # 最大空闲时间(秒)
    antsCap: 0                    # 如果您希望使用动态调整的协程池，可以将 antsCap 设置为 0
    reconnectTime: 3              # 设置重连时间间隔选项(秒)
    dialTimeout: 5                # 设置连接超时时间选项(秒)
    heartbeat: 20                 # 设置心跳间隔选项(秒)
    statsLogOpen: true            # 统计日志打印 true开false关
  DoingOrder: # 订单处理配置
    enable: false                  # 是否启用
    queueType: "dead"             # 队列类型 普通死信队列选项dead 自定义死信队列 customerDead 正常队列 normal 延时队列 delay
    exchangeName: "DoingOrderExchange"     # 交换机名称
    normalQueueName: "DoingOrderQueue"     # 正常队列名称
    normalKey: "DoingOrderExchange.DoingOrderQueue" #绑定键
    deadQueueName: "DoingOrderQueueDL"     # 死信队列名称
    deadKey: "DoingOrderExchange.DoingOrderQueueDL" #绑定键
    errQueueName: "DoingOrderQueueErr"    # 重试队列名称（customerDead模式）
    errKey: "DoingOrderExchange.DoingOrderQueueErr" #重试队列绑定键
    # 死信队列交换机选项
    exchangeDeclareOptions:
      durable: true               # 交换机是否持久化，即使服务器重启也保留
      autoDelete: false           # 是否自动删除，当最后一个消费者断开连接时是否自动删除
      internal: false             # 是否为内部使用，true表示只用于exchange到exchange的绑定
      noWait: false               # 是否非阻塞处理，true表示不等待服务器确认
    # 死信队列队列选项
    deadQueueDeclareOption:
      durable: true               # 队列是否持久化，即使服务器重启也保留
      autoDelete: false           # 是否自动删除，当最后一个消费者断开连接时是否自动删除
      exclusive: false            # 是否排他，只有创建它的连接才能访问
      noWait: false               # 是否非阻塞处理，true表示不等待服务器确认
      args:
        xMessageTtl: 60000        # 消息过期时间（队列级别）,毫秒
    # 死信队列队列绑定选项
    deadQueueBindOption:
      noWait: false               # 是否非阻塞处理，true表示不等待服务器确认
    # 重试队列声明选项（customerDead模式）
    errQueueDeclareOption:
      durable: true               # 队列是否持久化，即使服务器重启也保留
      autoDelete: false           # 是否自动删除，当最后一个消费者断开连接时是否自动删除
      exclusive: false            # 是否排他，只有创建它的连接才能访问
      noWait: false               # 是否非阻塞处理，true表示不等待服务器确认
    # 重试队列绑定选项（customerDead模式）
    errQueueBindOption:
      noWait: false               # 是否非阻塞处理，true表示不等待服务器确认
    normalQueueDeclareOption:
      durable: true               # 队列是否持久化，即使服务器重启也保留
      autoDelete: false           # 是否自动删除，当最后一个消费者断开连接时是否自动删除
      exclusive: false            # 是否排他，只有创建它的连接才能访问
      noWait: false               # 是否非阻塞处理，true表示不等待服务器确认
    normalQueueBindOption:
      noWait: false               # 是否非阻塞处理，true表示不等待服务器确认
    # 消费者选项
    consumerOption:
      prefetchCount: 1            # 指定消费者可以同时处理的消息数量上限。例如，如果设置为 1，则消费者在处理完前 1 条消息之前不会接收新的消息。 prefetchCount 为 0，表示不限制消息数量
      prefetchSize: 0             # 预取消息大小，0表示无限制
      global: false               # 是否全局生效（对整个通道生效，而不仅仅是当前消费者）
      consumer: "doingOrder"       # 消费者标识，用于区分多个消费者
      exclusive: false            # 是否独占，只有创建它的程序才能访问
      noLocal: false              # 如果设置为true，同一个Connection中的生产者发送的消息不能传递给该Connection中的消费者
      noWait: false               # 是否阻塞处理
      msgDurable: true            # 消息是否持久化
      isAutoAck: false            # 是否自动确认消息
    consumerNum: 10               # 消费者数量

# Elasticsearch设置
elasticsearch:
  isOpen: false                    # 是否开启
  # Elasticsearch服务器地址列表
  addresses:
    - "http://127.0.0.1:9200"
  # 认证信息
  username: "elastic"             # 用户名
  password: "elastic"             # 密码
  apiKey: "aaa"                   # API密钥
  # 超时时间(秒)
  timeout: 30                     # 超时时间
  # 连接池配置
  maxIdleConns: 20                # 最大空闲连接数
  maxIdleConnsPerHost: 5          # 每个主机最大空闲连接数
  maxConnsPerHost: 20             # 每个主机最大连接数
  idleConnTimeout: 90             # 空闲连接超时时间(秒)
  tlsHandshakeTimeout: 10         # TLS握手超时时间(秒)
  expectContinueTimeout: 1        # 期望继续超时时间(秒)
  responseHeaderTimeout: 10       # 响应头超时时间(秒)
  connectionTimeout: 30           # 连接超时时间(秒)
  connectionKeepAlive: 30         # 连接保持时间(秒)
  # 重试配置
  retryOnStatus: # 需要重试的HTTP状态码
    - 502
    - 503
    - 504
    - 429
  maxRetries: 3                   # 最大重试次数
  retryBackoff: 100               # 重试间隔基础时间(毫秒)
  # 健康检查
  enablePingCheck: true           # 是否启用ping检查
  enableHealthCheck: true         # 是否启用健康检查

# 邮件服务配置（支持腾讯云SES/阿里云DM/SMTP）
email:
  providerType: "tencent_ses"     # tencent_ses | aliyun_dm | smtp
  region: "ap-guangzhou"          # 区域
  accessKeyID: "YOUR_AK"          # AK/SK（建议从环境变量读取）
  secretKey: "YOUR_SK"
  # SMTP专用（providerType=smtp时使用）
  smtp:
    host: "smtp.qq.com"
    port: 465
    username: "your_email@qq.com"
    password: "your_auth_code"

# 短信服务配置（支持腾讯云SMS/阿里云SMS）
sms:
  providerType: "tencent_sms"        # tencent_sms | aliyun_sms
  region: "ap-guangzhou"              # 区域（短信发送接口仅支持广州/新加坡等地域）
  accessKeyID: ""   # SecretId
  secretKey: ""        # SecretKey
  appID: ""                # 短信应用ID（SmsSdkAppId）

websocket:
  sso:
    # ==================== 单点登录 ====================
    enableSSO: true         # 是否启用单点登录（后登录踢前登录）

  upgrade:
    # ==================== upgrade & 连接基础 ====================
    cors: true              # upgrade 总开关（false=拒绝所有来源）
    allowedOrigins: []      # 允许的来源域名/IP 白名单，空列表且 cors=true 时允许所有
                            # 示例: ["http://localhost:8080","https://example.com","192.168.1.1"]
    readBufferSize: 0        # 读缓冲区大小（字节），0=4096
    writeBufferSize: 0       # 写缓冲区大小（字节），0=4096
    enableCompression: true  # WebSocket 压缩开关（true=启用，false=禁用）
    subprotocols: ""         # 子协议列表（逗号分隔），空字符串=不协商，如 "chat,v2"

  queue:
    # ==================== 客户端队列 & 超时 & 消息限制（影响背压行为） ====================
    writeQueueSize: 1024       # 写入队列容量，0=默认 1024
    readQueueSize: 1024        # 读取队列容量，0=默认 1024
    readTimeout: 60          # 读取超时（秒），0=不限制，建议 60
    writeTimeout: 10         # 写入超时（秒），0=默认 10
    readLimit: 0             # 单条消息读取大小限制（字节），0=不限制
    writeLimit: 0            # 单条消息写入大小限制（字节），0=不限制
    writeMsgType: 1          # 消息帧类型：1=Text 2=Binary（二进制协议如 protobuf 请设为 2）

  heartbeat:
    # ==================== 心跳保活 ====================
    enableHeartbeat: true  # 是否启用心跳保活（false=禁用）
    heartbeatInterval: 30    # 心跳间隔（秒），0=使用默认值 30
    pongTimeout: 10          # Pong 响应超时（秒），0=默认 10
    pingWriteWait: 5         # Ping 控制帧写入超时（秒），0=默认 5

  limit:
    # ==================== 限流与安全防护 ====================
    enableRateLimit: false # 是否启用全局速率限制（false=禁用）
    rateLimitRps: 0          # 全局升级速率限制（每秒请求数），0=不限制
    rateLimitBurst: 0        # 限流突发量，0=不限制
    maxConnPerIP: 0          # 单 IP 最大连接数，0=不限制

  distributed:
    # ==================== 分布式分发 ====================
    enableDistributed: true # 是否启用分布式分发（false=单机模式，true=分布式模式）
    rabbitmqURL: "amqp://user:password@host:5672/"  # RabbitMQ 连接地址
    exchange: "ws:messages"   # WebSocket 消息交换机名称
    workerPool: 0              # Worker 协程数（分布式模式），0=默认 4，建议 2~16
    maxConnections: 0          # 最大连接数（分布式模式），0=不限制