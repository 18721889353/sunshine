# golangci-lint v2 配置：由 v1 配置经 `golangci-lint migrate` 转换而来。
# 必须使用 v2（模块路径 github.com/golangci/golangci-lint/v2/...）：v1.64.8 无法解析
# Go 1.27 标准库的导出数据（export data version 5 > maximum supported 2），会整仓报 typechecking error。
# v2 默认新开了 v1 基线中不存在的判定项（govet 的 inline、staticcheck 的 QF*/ST*），
# 下方逐项显式关闭以保持升级前后的判定基线等价；如需采纳新规则，请单独提改动。
version: "2"
run:
  concurrency: 4
  build-tags:
    - mytag
  issues-exit-code: 1
  tests: false
linters:
  # 禁用所有默认 linter，手动启用需要的
  default: none
  enable:
    - dogsled
    - errcheck
    - gocognit
    - goconst
    - gocyclo
    - govet
    - lll
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    dogsled:
      max-blank-identifiers: 2
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt:.*
        - io/ioutil:^Read.*
        - (*bytes.Buffer).Write
        - (*strings.Builder).WriteString
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (net/http.ResponseWriter).WriteString
    gocognit:
      min-complexity: 40
    goconst:
      min-len: 4
      min-occurrences: 4
    gocyclo:
      min-complexity: 40
    govet:
      enable:
        - atomicalign
        - shadow
        - nilness
        - unusedwrite
      # inline 为 v2 默认新开的分析器（v1 基线无），命中项均为“常量/构造调用可内联”的风格建议
      disable:
        - inline
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
            - (github.com/18721889353/sunshine/pkg/logger).Infof
            - (github.com/18721889353/sunshine/pkg/logger).Warnf
            - (github.com/18721889353/sunshine/pkg/logger).Errorf
    lll:
      line-length: 260
      tab-width: 4
    revive:
      max-open-files: 2048
      rules:
        - name: atomic
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: argument-limit
          arguments:
            - 8
        - name: function-result-limit
          arguments:
            - 3
        - name: cyclomatic
          arguments:
            - 40
        - name: bare-return
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: deep-exit
        - name: defer
          arguments:
            - - call-chain
              - loop
        - name: duplicated-imports
        - name: early-return
        - name: identical-branches
        - name: import-shadowing
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: range-val-address
        - name: range-val-in-closure
        - name: string-of-int
        - name: struct-tag
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unnecessary-stmt
        - name: waitgroup-by-value
    staticcheck:
      # QF*（quickfix 自动改写建议）与 ST*（stylecheck 风格规则）在 v1 配置中未启用，
      # v2 将它们归入 staticcheck 默认开启；此处关闭，保留 SA*（真实缺陷/弃用 API）与 S*/SF*
      checks: [ "all", "-QF*", "-ST*" ]
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    rules:
      # 代码生成器包本体就是由待替换的字面量模板构成（占位符标记、configmap 模板串），
      # 抽成常量会与 replacer 的纯文本替换设计冲突，故不纳入 goconst 判定
      - linters:
          - goconst
        path: cmd/sunshine/commands/generate/.*
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocognit
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - revive
        path: internal/dao/.*
        text: bool-literal-in-expr
      - linters:
          - all
        path: .*\.pb\.go$
      - linters:
          - revive
        path: main\.go
        text: deep exit
      - linters:
          - gosec
        path: internal/hmac/
        text: weak cryptographic primitive
      - linters:
          - lll
        source: '^//go:generate '
      - path: (.+)\.go$
        text: G601
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - .*\.pb\.go$
      - .*\_test\.go$
      - ^docs/.*
      - ^docs$
      - ^api$
      - ^vendor$
      - ^third_party$
      - ^\\.git$
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: ""
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/18721889353/sunshine
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*\_test\.go$
      - ^docs/.*
      - ^docs$
      - ^api$
      - ^vendor$
      - ^third_party$
      - ^\\.git$
      - third_party$
      - builtin$
      - examples$
