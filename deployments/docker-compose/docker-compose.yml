version: "3.7"

services:
  server-name-example:
    image: project-name-example/server-name-example:latest
    container_name: server-name-example
    restart: always
    command: ["./serverNameExample", "-c", "/app/configs/serverNameExample.yml"]
    volumes:
      - $PWD/configs:/app/configs
    ports:
      - "7001:7001"   # grpc 端口
      - "8001:8001"   # http 端口
      - "6001:6001"   # gRPC 指标/pprof 端口

