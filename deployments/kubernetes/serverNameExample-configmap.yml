# ConfigMap: 存储配置中心连接信息，挂载到容器内供应用读取
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-name-example-config       # ConfigMap 名称，Deployment 中通过此名称引用
  namespace: project-name-example        # 所属命名空间
  labels:
    app: server-name-example             # 标签，便于按标签筛选和管理
data:
  # 配置中心连接配置, 应用启动后通过该文件连接 Nacos 拉取完整业务配置
  # 注意: 该挂载会遮蔽镜像内 /app/configs/ 下的配置文件, 需保证此文件存在且正确
  serverNameExample_cc.yml: |-
    # App config from nacos

    # nacos settings
    nacos:
      ipAddr: "127.0.0.1"               # Nacos 地址
      port: 8848                        # Nacos HTTP 端口
      grpcPort: 9848                    # Nacos gRPC 端口
      scheme: "http"                    # http 或 grpc
      contextPath: "/nacos"             # Nacos 上下文路径
      namespaceID: ""                   # 命名空间 ID，使用公共命名空间时留空
      group: "dev"                      # 分组: dev, prod, test, 按部署环境调整
      dataID: "serverNameExample.yml"   # 配置文件 ID（需先在 Nacos 控制台创建）
      format: "yaml"                    # 配置文件类型: json, yaml, toml
      username: "ENC(4baa17fca9af16cfd9a563b686fc6323)"        # Nacos 用户名（已 SM4 加密）
      password: "ENC(375e0e53a2773d65e0feb01b0db729dc)"        # Nacos 密码（已 SM4 加密）
