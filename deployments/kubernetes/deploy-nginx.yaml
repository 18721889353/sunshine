# ================================================================
# IngressClass：业务 Ingress 通过 ingressClassName: nginx 关联本控制器
# ================================================================
apiVersion: networking.k8s.io/v1                   # Kubernetes API 版本
kind: IngressClass                                # 资源类型：IngressClass
metadata:                                         # 元数据
  labels:                                         # 标签
    app.kubernetes.io/component: controller       # 组件类型：控制器
    app.kubernetes.io/instance: ingress-nginx     # 实例名称
    app.kubernetes.io/name: ingress-nginx         # 应用名称
    app.kubernetes.io/part-of: ingress-nginx      # 所属应用
    app.kubernetes.io/version: 1.8.1              # 版本号
  name: nginx                                     # IngressClass 名称（Ingress 中通过 ingressClassName: nginx 引用）
spec:                                             # 规格
  controller: k8s.io/ingress-nginx                # 控制器名称（必须与 Ingress Controller 的 --controller-class 参数匹配）

---
# ================================================================
# 准入校验配置：创建/更新 Ingress 时由控制器校验其合法性
# ================================================================
apiVersion: admissionregistration.k8s.io/v1       # Kubernetes API 版本
kind: ValidatingWebhookConfiguration              # 资源类型：验证 Webhook 配置
metadata:                                         # 元数据
  labels:                                         # 标签
    app.kubernetes.io/component: admission-webhook  # 组件类型：准入 Webhook
    app.kubernetes.io/instance: ingress-nginx     # 实例名称
    app.kubernetes.io/name: ingress-nginx         # 应用名称
    app.kubernetes.io/part-of: ingress-nginx      # 所属应用
    app.kubernetes.io/version: 1.8.1              # 版本号
  name: ingress-nginx-admission                   # Webhook 配置名称
webhooks:                                         # Webhook 列表
  - admissionReviewVersions: ["v1"]                 # 支持的 API 版本
    clientConfig:                                   # 客户端配置
      service:                                      # 后端服务
        name: ingress-nginx-controller-admission    # Service 名称
        namespace: ingress-nginx                    # Service 命名空间
        path: /networking/v1/ingresses              # 验证路径
    failurePolicy: Fail                             # 验证失败时拒绝请求（Fail）
    matchPolicy: Equivalent                         # 匹配策略：等价匹配
    name: validate.nginx.ingress.kubernetes.io     # Webhook 名称
    rules:                                          # 匹配规则
      - apiGroups: ["networking.k8s.io"]              # API 组
        apiVersions: ["v1"]                           # API 版本
        operations: ["CREATE", "UPDATE"]              # 操作类型：创建和更新
        resources: ["ingresses"]                      # 资源类型：Ingress
    sideEffects: None                               # 无副作用

---
# ================================================================
# ★★★ 新增：PodDisruptionBudget（防止意外驱逐） ★★★
# 确保在任何时候至少有一个 Ingress Controller Pod 可用
# 即使节点维护或资源紧张，Pod 也不会被强制删除
# ================================================================
apiVersion: policy/v1                              # Kubernetes API 版本
kind: PodDisruptionBudget                          # 资源类型：PodDisruptionBudget（Pod 中断预算）
metadata:                                         # 元数据
  name: ingress-nginx-pdb                          # 资源名称
  namespace: ingress-nginx                         # 所属命名空间
  labels:                                         # 统一标签
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
spec:                                             # 规格
  # ★ minAvailable: 1 表示至少有一个 Pod 处于可用状态
  # 单节点下确保 Pod 不会被意外驱逐，多节点时保证至少一个存活
  minAvailable: 1
  selector:                                       # 选择器，匹配 Ingress Controller 的 Pod
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx
      app.kubernetes.io/name: ingress-nginx